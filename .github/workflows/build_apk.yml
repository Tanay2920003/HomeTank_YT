name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'tanksync_flutter/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'tanksync_flutter/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tanksync_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK with clear name
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/tanksync-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tanksync-release-apk
          path: tanksync_flutter/output/tanksync-release.apk
          retention-days: 30

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r\n ')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.app_version.outputs.version_name) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('HomeTank v{0}', steps.app_version.outputs.version_name) }}
          body: |
            ### 📱 HomeTank Android App (${{ steps.app_version.outputs.version }})
            
            Direct APK download for Android devices:
            - **Download:** [`tanksync-release.apk`](#) (attached below)
            - **Source commit:** `${{ github.sha }}`
            - **Built with:** Flutter stable & Android SDK
          files: tanksync_flutter/output/tanksync-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
